# Local production-like stack: nginx serves the static page, gunicorn compiles
# and runs the submitted code behind it.
services:
  backend:
    build: .
    container_name: openmp-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      OPENMP_WORKDIR: /tmp/openmp_compiler
      OPENMP_SANDBOX_USER: sandbox
      OPENMP_MAX_WORKERS: 16
      OPENMP_RATE_LIMIT: 20
      OPENMP_MAX_CONCURRENT_JOBS: 4
      OPENMP_LOG_LEVEL: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # --- containment -----------------------------------------------------
    # The server drops each compiled program to the unprivileged `sandbox`
    # user, so it keeps only the capabilities needed to do that and to own the
    # per-job scratch directory. Everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    # Cgroup-level backstop against fork bombs, independent of RLIMIT_NPROC.
    # Keep comfortably above OPENMP_MAX_PROCESSES.
    pids_limit: 512
    read_only: true
    tmpfs:
      # `noexec` is deliberately absent: compiled programs run from here.
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    ulimits:
      core: 0

  frontend:
    image: nginx:alpine
    container_name: openmp-frontend
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: openmp-network
