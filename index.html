<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMP &amp; MPI Online Compiler</title>
    <meta name="description" content="Write, compile and run OpenMP and MPI programs in C and C++ from the browser.">
    <meta name="color-scheme" content="light dark">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
          integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
          integrity="sha384-ccdJwIIg/K0Ab6aXF4MPACh7ckk61tvQFTrfkhXZEALgAETURNZIAuQLcS/aPbrM"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div>
                <h1>OpenMP &amp; MPI Compiler</h1>
                <p>Write, compile and run parallel C/C++ programs in your browser</p>
            </div>
            <button id="themeToggle" class="btn btn--icon" type="button" aria-pressed="false"
                    title="Toggle dark mode">
                <span id="themeIcon" aria-hidden="true">&#9789;</span>
                <span class="visually-hidden">Toggle dark mode</span>
            </button>
        </header>

        <div class="banner">
            <span aria-hidden="true">&#9888;</span>
            <p id="limitsBanner">
                <strong>Note:</strong> code runs in a sandboxed container with CPU, memory and
                time limits. Do not paste anything sensitive.
            </p>
        </div>

        <main class="workspace">
            <section class="panel panel--editor" aria-labelledby="editorHeading">
                <div class="panel__header">
                    <h2 id="editorHeading"><span class="panel__icon" aria-hidden="true">&#128221;</span> Code Editor</h2>
                    <div class="chip-row">
                        <button id="copyCodeBtn" class="btn btn--ghost" type="button">Copy</button>
                        <button id="downloadBtn" class="btn btn--ghost" type="button">Download</button>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="field">
                        <label for="languageSelect">Lang</label>
                        <select id="languageSelect">
                            <option value="c" selected>C</option>
                            <option value="cpp">C++</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="modeSelect">Mode</label>
                        <select id="modeSelect">
                            <option value="openmp" selected>OpenMP</option>
                            <option value="mpi">MPI</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="workerSelect" id="workerLabel">Threads</label>
                        <select id="workerSelect">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="4" selected>4</option>
                            <option value="8">8</option>
                            <option value="16">16</option>
                        </select>
                    </div>
                    <div class="toolbar__actions">
                        <button id="clearBtn" class="btn" type="button">Clear</button>
                        <button id="runBtn" class="btn btn--primary" type="button">
                            <span id="runBtnLabel">Run</span>
                            <span aria-hidden="true">&#9654;</span>
                        </button>
                    </div>
                </div>

                <div class="panel__body">
                    <div class="editor-host">
                        <textarea id="codeEditor" aria-label="Source code"></textarea>
                    </div>

                    <div class="examples">
                        <h3>OpenMP examples</h3>
                        <div class="chip-row" id="openmpExamples"></div>
                        <h3>MPI examples</h3>
                        <div class="chip-row" id="mpiExamples"></div>
                    </div>
                </div>
            </section>

            <section class="panel panel--output" aria-labelledby="outputHeading">
                <div class="panel__header">
                    <h2 id="outputHeading"><span class="panel__icon" aria-hidden="true">&#128202;</span> Output</h2>
                    <div class="chip-row">
                        <button id="copyOutputBtn" class="btn btn--ghost" type="button">Copy</button>
                        <button id="clearOutputBtn" class="btn btn--ghost" type="button">Clear</button>
                    </div>
                </div>
                <div class="panel__body">
                    <div id="output" class="console" role="log" aria-live="polite" aria-atomic="false"></div>
                </div>
            </section>
        </main>

        <div class="statusbar">
            <div class="status-item">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Ready</span>
            </div>
            <div class="status-item keyboard-hint">
                <kbd>Ctrl</kbd><span>+</span><kbd>Enter</kbd><span>to run</span>
            </div>
            <div class="status-item">
                <span>Backend:</span>
                <span id="backendStatus">Checking&hellip;</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"
            integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"
            integrity="sha384-o9m634t2Hy35pPNKd9Xe16ntbSw11jCOuKPDrzQGXI8k87L2JZthaA3rwmJjnF7Z"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"
            integrity="sha384-LjCI3E8qhhxXZvu7+FCvqx9eZYSowFvuJ7z54KsgI/BDPGKEuysqCg/vYiKHvC4Y"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"
            integrity="sha384-69mJoUoPPF/C7qPs6lLjvXvrt6w225+rmxWqGO3a1glVjITdnnwPQOtG9FRTd2Ni"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"
            integrity="sha384-B6Af6BES5glvxvAPc9Vrl9t1lHx1k3iL8AcT1XmsmlEVZudSW8E+8CA1TxVbdQbj"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="static/js/examples.data.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
