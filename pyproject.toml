[project]
name = "openmp-online-compiler"
version = "2.0.0"
description = "Browser-based compiler and runner for OpenMP and MPI programs in C and C++"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1",
    "flask-cors>=6.0",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["examples", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Flask/dataclass patterns rely on calls in defaults
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
